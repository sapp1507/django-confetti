[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "django-confetti"
version = "1.5.0"
description = "Dynamic settings and feature flags for Django with typed values, overrides, caching, REST API and snapshots."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Sapp", email = "sapp1507@gmail.com" }]
keywords = ["django", "settings", "feature-flags", "config"]
classifiers = [
  "Framework :: Django",
  "Framework :: Django :: 3.2",
  "Framework :: Django :: 4",
  "Programming Language :: Python :: 3",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
  "Django>=3.2",
  # DRF и crontab/dateutil делаем опциональными
]

[project.optional-dependencies]
drf = ["djangorestframework>=3.14"]
docs = ["djangorestframework>=3.14", "drf-yasg>=1.21.5"]

[tool.setuptools.packages.find]
where = ["."]
include = ["confetti*"]

[tool.setuptools.package-data]
confetti = ["migrations/*.py"]
